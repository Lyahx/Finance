# Railway config — Frontend service (Next.js)
# Alternative-web-ui klasörünü Railway'de root olarak ayarla.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# NEXT_PUBLIC_API_URL build-time'da bake olur — Railway'de Service Variables → Build args.

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/"
healthcheckTimeout = 20
