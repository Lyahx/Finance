services:
  lyrabit-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: LyraBit-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LyraBitDev_2024!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - lyrabit-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "LyraBitDev_2024!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lyrabit-net

  lyrabit-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lyrabit-api:dev
    container_name: LyraBit-api
    restart: unless-stopped
    depends_on:
      lyrabit-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      PORT: "8080"
      ConnectionStrings__DefaultConnection: "Server=lyrabit-db,1433;Database=LyraBitDb;User Id=sa;Password=LyraBitDev_2024!;TrustServerCertificate=True;"
      Jwt__Key: "dev-only-change-me-in-production-min-32-chars-long"
      Jwt__Issuer: "LyraBit"
      Jwt__Audience: "LyraBit.Clients"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5000:8080"
    networks:
      - lyrabit-net

  lyrabit-web:
    build:
      context: ./Alternative-web-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
    image: lyrabit-web:dev
    container_name: LyraBit-web
    restart: unless-stopped
    depends_on:
      - lyrabit-api
    ports:
      - "3000:3000"
    networks:
      - lyrabit-net

volumes:
  lyrabit-db-data:

networks:
  lyrabit-net:
    driver: bridge
